# Sample Queryfolio configuration file.
# Place it at ~/.config/queryfolio/config.yml (or config.yaml).
#
# For development and testing, the QUERYFOLIO_CONFIG_YAML environment variable can override the
# entire contents of this file (when the GUI is launched from Finder / the Dock, shell
# environment variables are not passed).

# --- servers (connection definitions; the format of each entry is compatible with sql-agent-mcp-server) ---
#
# Note: this key used to be named sql_servers (and server_templates was formerly
# sql_server_templates). Using the old names causes an error at startup.

servers:
  - name: dev-postgres
    description: "開発環境の PostgreSQL サーバー"
    engine: postgres
    host: localhost
    port: 5432
    schema: development_db
    user: dev_user
    password: your_password_here

  - name: dev-mysql
    description: "開発環境の MySQL サーバー"
    engine: mysql
    host: localhost
    port: 3306
    schema: test_db
    user: mysql_user
    password: your_mysql_password

  # --- TLS for SQL engines (mysql / postgres) ---
  #
  # Important: a direct connection with neither ssl_mode nor tls runs with sqlx's default (prefer).
  # prefer "tries TLS, falls back to plaintext if it cannot be established, and does not verify
  # the server certificate even when it can", so an attacker on the path can eavesdrop on or
  # tamper with the traffic.
  # For connections made directly over the internet (RDS, etc.), always specify tls: true or
  # ssl_mode. Hovering over a connection shows its TLS values in the details.
  #
  # tls: true         -> the default when ssl_mode is omitted becomes verify-full
  # ssl_mode:         -> disable / prefer / require / verify-ca / verify-full
  #                      (takes precedence over tls. MySQL's verify-full is VerifyIdentity)
  # ssl_root_cert:    -> root certificate (PEM) for using a self-signed CA. ~ is expanded.
  #                      Combining it with a non-verifying mode (disable / prefer / require)
  #                      would be silently ignored, so it is treated as a configuration error
  #                      (specify verify-ca / verify-full)
  #
  # For connections through an SSH tunnel the target becomes 127.0.0.1, so verify-full fails at
  # certificate hostname verification. The tunnel itself is encrypted, so either leave it
  # unspecified (stay on prefer) or stop at require.
  - name: prod-postgres
    description: "本番 PostgreSQL (TLS 必須 + 証明書検証)"
    engine: postgres
    host: db.example.com
    port: 5432
    schema: production_db
    user: readonly_user
    password: your_password_here
    readonly: true
    tls: true
    # ssl_mode: verify-full
    # ssl_root_cert: ~/.config/queryfolio/certs/rds-ca.pem

  # queryfolio extension: sqlite takes the DB file path in schema
  - name: local-sqlite
    description: "ローカルの SQLite ファイル"
    engine: sqlite
    schema: ~/data/example.sqlite3

  # queryfolio extension: like sqlite, duckdb takes the DB file path in schema
  # (it is an error if the file does not exist; a new one is not created).
  # As a SQL engine, SELECT / meta commands / EXPLAIN / auto LIMIT are available.
  - name: local-duckdb
    description: "ローカルの DuckDB ファイル"
    engine: duckdb
    schema: ~/data/example.duckdb

  # queryfolio extension: mssql (alias: sqlserver). Connects to Microsoft SQL Server over
  # TDS (tiberius). schema is the database name (master if omitted); authentication is only SQL
  # Server authentication with user / password. ssl_mode / tls / ssl_root_cert are the same as
  # for mysql / postgres (verify-ca is treated the same as verify-full).
  # As a SQL engine, SELECT / meta commands / EXPLAIN (SHOWPLAN) / auto LIMIT (TOP) are
  # available. Only cell editing is unsupported.
  - name: dev-mssql
    description: "開発用 SQL Server"
    engine: mssql
    host: localhost
    port: 1433
    schema: AdventureWorks
    user: sa
    password: your_password
    # tls: true

  # queryfolio extension: redis (alias: valkey).
  # The editor takes 1 line = 1 command (GET my-key / MGET a b c ...).
  # schema is the database number (0 if omitted). user / password are used for ACL / AUTH.
  # SSH tunnels can be used just like with SQL engines.
  # tls: true (queryfolio extension, false if omitted) makes it a TLS connection (rediss://).
  # The certificate is always verified (system trust store). Through an SSH tunnel the target
  # becomes 127.0.0.1 and hostname verification fails, so do not combine them.
  - name: local-redis
    description: "ローカルの Redis"
    engine: redis
    host: localhost
    port: 6379
    schema: "0"
    # tls: true

  # queryfolio extension: elasticsearch (alias: es / opensearch).
  # The editor takes Kibana Console-style request blocks
  # (a method line like `GET /index/_search` + a JSON body; lines starting with # are comments).
  # user / password are used for Basic authentication. SSH tunnels work as with SQL engines.
  # tls: true (queryfolio extension, false if omitted) makes it an https connection.
  - name: local-elasticsearch
    description: "ローカルの Elasticsearch"
    engine: elasticsearch
    host: localhost
    port: 9200
    # tls: true
    # user: elastic
    # password: your_es_password

  # queryfolio extension: dynamodb. Runs PartiQL (a SQL-compatible subset) through the
  # ExecuteStatement API. The editor takes SQL (SELECT / INSERT / UPDATE /
  # DELETE. PartiQL has no LIMIT clause; the row count is capped by an app-side limit).
  # schema = AWS region (required). Authentication is resolved in this order:
  #   1. user / password (static access key ID / secret access key)
  #   2. aws_profile (queryfolio extension; a profile name in ~/.aws)
  #   3. the default credentials chain (environment variables -> default profile -> IMDS)
  - name: aws-dynamodb
    description: "AWS の DynamoDB (ap-northeast-1)"
    engine: dynamodb
    schema: ap-northeast-1
    # aws_profile: my-profile
    # readonly: true   # when only SELECT should be allowed

  # Example for dynamodb-local (docker run -p 8000:8000 amazon/dynamodb-local).
  # Override the endpoint with host / port (tls: true for https).
  # dynamodb-local does not validate credentials, so user / password can be dummies
  # (alphanumeric only; dynamodb-local rejects keys containing hyphens, etc.).
  - name: local-dynamodb
    description: "ローカルの dynamodb-local"
    engine: dynamodb
    schema: us-east-1
    host: 127.0.0.1
    port: 8000
    user: dummyAccessKey
    password: dummySecretKey

  # queryfolio extension: specifying readonly: true (false if omitted) rejects execution of
  # write statements (INSERT / UPDATE / DELETE / DDL, DML with a CTE,
  # SELECT INTO, etc.).
  # It cannot prevent SELECTs that call functions with side effects (nextval, etc.).
  # It is only a guard against accidents.
  - name: production-replica
    description: "本番レプリカ (読み取り専用)"
    engine: mysql
    host: replica.example.com
    port: 3306
    schema: production_db
    user: replica_user
    password: replica_password
    readonly: true

  # queryfolio extension: allow_dangerous_statements (false if omitted).
  # When omitted, dangerous statements (UPDATE / DELETE without WHERE, DROP, TRUNCATE) are
  # rejected to prevent destroying all rows or losing tables through a mistaken operation.
  # With true these statements can be run, but a confirmation dialog appears before execution.
  - name: dev-db
    description: "開発用 DB (危険な文も確認の上で実行できる)"
    engine: postgres
    host: localhost
    port: 5432
    schema: dev
    user: dev_user
    password: dev_password
    allow_dangerous_statements: true

  - name: remote-db-with-ssh
    description: "SSH トンネル経由でアクセスするリモートデータベース"
    engine: postgres
    host: localhost  # For an SSH tunnel, specify the DB host as seen from the bastion
    port: 5432
    schema: remote_db
    user: remote_user
    password: remote_password
    ssh_tunnel:
      host: ssh.example.com
      port: 22
      user: ssh_user
      # password: ssh_password  # or use private_key_path
      private_key_path: ~/.ssh/id_rsa
      # private_key_passphrase: key_passphrase
      # When no password/private_key_path is set, the SSH agent is used.
      # The agent socket is resolved from ~/.ssh/config (IdentityAgent) and
      # then SSH_AUTH_SOCK. Override it here if the app is launched in an
      # environment that does not inherit the right socket (e.g. the
      # 1Password SSH agent when launched from Finder). "none" disables the agent.
      # identity_agent: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock

  - name: remote-db-via-ssh-config
    description: "~/.ssh/config の Host エイリアスで接続 (ProxyJump / 多段トンネル対応)"
    engine: postgres
    host: localhost  # DB host as seen from the bastion (the final host in ssh_config)
    port: 5432
    schema: remote_db
    user: remote_user
    password: remote_password
    ssh_tunnel:
      # queryfolio extension: delegate the tunnel to the system `ssh` client
      # using this ~/.ssh/config Host alias. HostName / User / Port / ProxyJump
      # (multi-hop) are all resolved by OpenSSH, so a config like
      #   Host pop-three-ec2-staging
      #       HostName 172.21.122.39
      #       User torico
      #       ProxyJump pop-three-bastion
      # just works by naming the alias here. host / user / private_key_path /
      # identity_agent above are ignored in this mode (auth and host-key
      # checking are handled entirely by OpenSSH).
      ssh_config: pop-three-ec2-staging

# --- servers: grouping (queryfolio extension) ---
# Writing group_name + servers as a list item shows the servers inside it under a group
# heading in the connection list. It can be mixed with directly written servers
# (they are displayed in the order configured). A group cannot contain another group.
# Template inheritance via template: also works inside a group.
#
# servers:
#   - group_name: production
#     servers:
#       - name: prod-main
#         engine: mysql
#         host: prod.example.com
#         ...
#       - name: prod-replica
#         engine: mysql
#         host: replica.example.com
#         ...
#   - group_name: development
#     servers:
#       - name: dev-db
#         engine: postgres
#         host: localhost
#         ...
#   - name: ungrouped-db   # ungrouped, directly written entries can be mixed in too
#     engine: sqlite
#     schema: ~/data/example.sqlite3

# --- Overriding the configuration from outside (optional) ---
# Runs the command written in config_override_command and recursively merges its stdout (YAML)
# into this configuration. The fetched YAML takes precedence.
#
# Merge rules:
#   - Mappings are merged recursively (e.g. replace only ai's api_key)
#   - Scalars and lists (including servers) are replaced wholesale
#   - Any key can be overridden, not only servers
#
# Even if the fetched YAML contains config_override_command, it is not fetched recursively.
# The command is run without a shell (pipes and redirects cannot be used).
#
# Example of fetching from 1Password:
# config_override_command: op read "op://development/queryfolio/config-yaml"

# --- Connection templates ---
# In servers, specify template: <name> to inherit from one.
# Keys specified on the server side override same-named keys of the template (shallow merge).
server_templates:
  - name: my-awesome-sql-host
    engine: mysql
    host: db.example.com
    port: 3306
    user: shared_user
    password: shared_password

# --- AI (natural language -> SQL generation) settings (optional) ---
# Can be written here (top level of the local config.yml) or at the top level of the YAML
# fetched by config_override_command. After merging, the fetched YAML takes precedence
# (if the API key is placed in a YAML inside 1Password, it does not remain in plaintext locally).
# ai:
#   provider: openai   # currently only openai is supported
#   api_key: sk-your-api-key
#   model: gpt-6-luna     # optional (gpt-6-luna if omitted)
#   base_url: https://api.openai.com/v1  # optional (for OpenAI-compatible APIs)
#   # AI chat uses function calling. Reasoning models such as gpt-6-luna fail on
#   # /v1/chat/completions when tools are used unless reasoning_effort is "none", so when the
#   # target is the official OpenAI, "none" is sent if this is omitted.
#   # When base_url points to an OpenAI-compatible API, it is sent only when explicitly specified
#   # (so as not to break servers that do not accept this parameter).
#   # An empty string means it is never sent.
#   # Also, if the request is rejected because of reasoning_effort, the parameter is removed and
#   # the request is automatically resent exactly once, so models that do not accept it work
#   # without any configuration change.
#   # However, gpt-6-astra does not accept "none", and removing it is rejected because of the
#   # constraint on combining with tools, so it cannot be used for AI chat (SQL generation /
#   # EXPLAIN explanation do not use tools).
#   tool_reasoning_effort: none   # optional ("" means do not send)

# --- Row limit automatically added to SELECTs without a LIMIT (optional; default 500, 0 disables) ---
# default_limit: 500

# --- Where query files are saved (optional; default ~/.config/queryfolio/sqlfiles) ---
# sqlfiles_dir: ~/queries
#
# A relative path is resolved against the configuration directory (~/.config/queryfolio), not
# the current directory. The CLI and the running window are separate processes (with different
# cwds), so a cwd-based path would make them point to different places.
#
# Query files are saved to <sqlfiles_dir>/<folder name>/<name>.sql.
# The folder name is determined per connection by the following rules (the connection name is not used):
#   - if the server specifies folder_name, it is used
#   - otherwise <host>_<engine>_<schema>_<user> is assembled
# Example: dev-postgres above becomes "localhost_postgres_development_db_dev_user".
# Specifying folder_name explicitly pins the folder name (it does not move when host etc. change):
#   - name: dev-postgres
#     folder_name: dev-pg
#     engine: postgres
#     ...
