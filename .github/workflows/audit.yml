name: Audit

# Periodically check dependencies for known vulnerabilities (CYBERNEURA-DEV-577).
#
# **Do not run on pull_request.** This repository does not use PR checks, and adding a PR trigger
# here would turn unrelated PRs red all at once on the day a new advisory appears upstream, blocking
# merges. What audit looks at is the current state of the dependency tree, not the change diff, so
# there is no need to run it for every PR either.
#
# Known issues that cannot be fixed right now are put on an ignore list:
#   - Rust: src-tauri/.cargo/audit.toml (write the reason and the condition for removing it)
#   - npm: no ignore mechanism is used. The only remaining one is cookie <0.7.0 (low) held by
#     @sveltejs/kit, which is waiting for a kit update
on:
  schedule:
    # Every Monday 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Split npm and cargo into **separate jobs**. If they are placed in the same job, subsequent steps
  # are skipped as soon as one finds something, and the other's result is invisible for that whole
  # week (one JS finding would hide the Rust findings).
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: pnpm audit
        # **Do not run `pnpm install`.** audit works with pnpm-lock.yaml alone (verified by measurement).
        # Installing would run the postinstall scripts etc. of the very dependencies being audited in CI every
        # week, making us the one to execute a compromised dependency if there were one.
        #
        # Do not fail on low. The only low remaining now is cookie <0.7.0 held by @sveltejs/kit,
        # and nothing can be done until kit raises its range. Making it red here would keep it red every week
        # for "one item waiting on upstream", and we would fail to notice when something genuinely new appears
        run: pnpm audit --audit-level moderate

  cargo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install cargo-audit
        # cargo audit reads only Cargo.lock, so building the dependencies is not needed
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # cargo-audit reads only .cargo/audit.toml for audit.toml, so
        # run with src-tauri as the working directory
        working-directory: src-tauri
        run: cargo audit
