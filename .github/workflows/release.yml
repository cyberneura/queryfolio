name: Release

# A release is decided by the version in src-tauri/tauri.conf.json on main. Putting a version on
# main that has not been released yet (and is newer than the latest published one) releases it;
# if it stays at an already released version, nothing happens no matter how often you push.
# Locally, `pnpm release [patch|minor|major]` (scripts/release.sh) numbers the version and
# pushes. Bumping the version inside a PR and merging it releases the same way.
#
# What decides whether to run is not the diff but "has this version been released". Squash /
# rebase / direct push change the diff but not the result (idempotent). No path filter is added
# for the same reason: so that a bump that lands in an unexpected shape is not missed.
on:
  push:
    branches: [main]
  # On a PR only the test job runs (plan and later are stopped by `if`). This runs the gate tests
  # with the same definition before merge, so the release path and the tests do not drift apart.
  pull_request:
  # For re-running when the version is correct but that run failed (e.g. a transient API failure).
  # It goes through the same check, so an already published version cannot be released again.
  workflow_dispatch:

# No permissions by default; grant them only to the jobs that need them. In particular, test runs
# code brought in by a PR, so it gets nothing beyond contents: read (for PRs from the same
# repository GITHUB_TOKEN may have write, so we do not leave it to the default here).
#
# This workflow also triggers on pull_request, but that does not mean "rewriting the workflow
# itself in a PR can run a contents: write job". For pull_request from a fork of a public
# repository, GITHUB_TOKEN is downgraded to read-only regardless of the permissions block and
# secrets are not passed (the setting that hands out a write token concerns private
# repositories, and does not apply here). Only people who already have write access can open a
# PR from a branch in the same repository, so that is not a privilege escalation either.
permissions: {}

# Serialize runs so they do not run concurrently. One dispatch corresponds to one version, so the
# version of a cancelled run would never be published (the bump commit stays on main). Both of
# these are needed to prevent that:
#   cancel-in-progress: false — do not cancel a running run with a later one.
#   queue: max — queue pending runs too, up to 100. The default `queue: single` means
#     "only one pending; when a new one is queued, cancel the existing pending and replace it",
#     so dispatching three times in a row loses the middle version.
# (combining queue: max with cancel-in-progress: true is a validation error)
#
# Because runs are serialized, the plan of a later run runs after the publish of the earlier run
# is done, so the same version is never built twice. However, the order in which pending runs are
# consumed is not necessarily the push order (GitHub does not guarantee start order). Even if an
# older version's run comes around after a newer version has been published first, plan stops it
# as "older than the latest".
#
# A PR check run is unrelated to the "1 push = 1 version" serialization, so it is not put in
# the release group. In the same group, a single PR run would leave the release pending
# (it keeps waiting because cancel-in-progress is false). Further, each commit gets its own
# group so that serialization is not applied on the PR side at all — if PRs were grouped here,
# consecutive pushes to the same PR would make checks of older commits queue up and the result
# of the newest commit would be the latest to arrive (this setup cannot make cancel-in-progress
# true only for PRs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # Before spending 30+ minutes on a build, confirm the version has not been released yet and is
  # newer than the latest published one. As long as this returns false, macOS / Windows runners
  # never start on a push.
  # The release decision is meaningless on a PR, so do not run it. When this job is skipped, the
  # build / publish that depend on it are also skipped (always() is not used) — on a PR only test
  # runs.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      # dispatch can specify its own ref. This prevents a branch carrying an unpublished version from
      # being released with that branch's contents (it cannot happen on push except for main, but it
      # can with dispatch).
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases come from main, and this run is on ${REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version out of src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The decision itself lives in scripts/release-decide.sh. publish uses the same decision right
      # before publishing. `release=$(...)` is captured by assignment so that a script failure
      # (undecidable) fails the step (-e does not take effect when a command substitution fails inside
      # echo's arguments).
      - name: Decide whether this version still needs releasing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release=$(bash scripts/release-decide.sh)
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Gate for the release build. Policy: docs/build-requires-tests.md in cyberneura/cyberneura-github-actions
  # docs/build-requires-tests.md
  #
  # runs-on is the same macOS / Windows as build because of the policy's rule 4.
  # lib.rs's #[cfg(target_os = "macos")] and the Windows-only code in cli.rs
  # (attach_parent_console) are not compiled at all, not even one line, on other OSes. Running
  # cargo test on ubuntu would pass without checking part of the code that goes into the artifacts.
  test:
    # On push / dispatch, run only when this is a version that will actually be released. Running
    # unconditionally without going through plan would start macOS / Windows runners on every push
    # to main that does not carry a release — defeating the purpose of having plan. On a PR plan is
    # skipped and by default this job would be dragged along and skipped too, so remove the
    # automatic skip with !cancelled() and then decide by event name (when plan fails, it stops at
    # needs.plan.result).
    needs: plan
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'pull_request'
              || (needs.plan.result == 'success'
                  && needs.plan.outputs.release == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # This is not a build, so matrix.rust-targets (the 2 architectures for universal) is not needed.
      # Test on the host target.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build.rs runs under cargo test too. tauri-build fails before reaching the app code unless
      # frontendDist (../build) actually exists, so build the frontend first.
      - name: Build frontend
        run: pnpm build

      - name: Type-check frontend
        run: pnpm check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Prepare, before the build, exactly one draft Release that all jobs in the matrix upload artifacts to.
  #
  # If only tagName is passed to tauri-action, each job "looks for the Release for that tag in the
  # list and creates it if missing" after its build. If the macOS and Windows builds finish almost
  # at the same time (e.g. a cached re-run), both decide "missing" and two drafts for the same tag
  # are created. publish can publish only one of them, and the other platform's artifacts are
  # missing from the Release. If the id created here is passed as releaseId, tauri-action uploads
  # to it without searching or creating.
  #
  # A draft left by a failed run is reused, and target_commitish is fixed to this run's commit
  # (publishing it with the commit of the run that first created the draft would make the tag
  # disagree with the contents).
  draft:
    # Do not create a draft until test passes (an empty draft would remain after each failure).
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Find or create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          # A draft cannot be looked up by tag (releases/tags/<tag> returns 404), so search the list.
          # With a contents: write token, the list includes drafts too.
          found=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          published=$(printf '%s\n' "$found" | awk '$2 == "false" { n++ } END { print n + 0 }')
          drafts=$(printf '%s\n' "$found" | awk '$2 == "true" { print $1 }')
          draft_count=$(printf '%s\n' "$found" | awk '$2 == "true" { n++ } END { print n + 0 }')
          if [ "$published" -gt 0 ]; then
            echo "::error::${TAG} is already published, but plan decided to release it. Not touching it."
            exit 1
          fi
          # We cannot decide which one to upload to. Silently picking one would publish with the remaining
          # drafts and artifacts split apart. Delete the unneeded drafts and re-run.
          if [ "$draft_count" -gt 1 ]; then
            echo "::error::found ${draft_count} draft releases for ${TAG} (ids: $(echo $drafts)). Delete all but one, then re-run."
            exit 1
          fi
          if [ "$draft_count" -eq 1 ]; then
            id="$drafts"
            gh api -X PATCH "repos/${GH_REPO}/releases/${id}" \
              -f target_commitish="${GITHUB_SHA}" --silent
            echo "Reusing draft ${id} for ${TAG} (target set to ${GITHUB_SHA})."
          else
            id=$(gh api -X POST "repos/${GH_REPO}/releases" \
              -f tag_name="${TAG}" -f name="Queryfolio ${TAG}" \
              -F draft=true -F prerelease=false \
              -f target_commitish="${GITHUB_SHA}" --jq '.id')
            echo "Created draft ${id} for ${TAG}."
          fi
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::could not get the id of the draft release for ${TAG} (got '${id}')."
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    # Do not build without passing test. needs only works on jobs in the same run, so do not split
    # the tests out into a separate workflow.
    needs: [plan, test, draft]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Distribute a universal binary that supports both Intel / Apple Silicon as a dmg.
          # Signing is Developer ID + notarization in the steps below. Local builds are ad-hoc via
          # signingIdentity "-" in tauri.conf.json, and in CI APPLE_SIGNING_IDENTITY overrides it
          # (tauri-cli precedence: env > config).
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          # Windows is only an unsigned NSIS installer (.exe). No MSI is built.
          - platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      # persist-credentials: false — so that checkout does not leave the write-capable GITHUB_TOKEN in
      # `.git/config`, so that later steps (pnpm install's install scripts and third-party actions)
      # cannot pick it up.
      # This job handles Apple certificates, so pin every `uses:` to a commit SHA (pinning only
      # tauri-action is not enough — the same happens if an action in an earlier step is tampered with).
      # When updating, look up the new SHA using the trailing `# v4` style comment and replace it.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Choose a SHA from **master history commits**. If you pin the tip SHA of a generated branch such as
      # `stable` / `1.89.0`, that commit is GC'd when the branch advances and later runs fail before the
      # Rust setup (see "Choice of full-length commit SHA" in the action's README). When pinning a
      # master SHA, the toolchain cannot be inferred from the ref, so specify `toolchain` explicitly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # If even one signing / notarization Secret is missing, tauri-action just gets an empty string
      # and the build still passes (producing ad-hoc signed or non-notarized artifacts). The publish job
      # only looks at success or failure, so it would publish as if it were "signed + notarized". Fail
      # explicitly here to prevent an undistributable dmg from being published.
      - name: Check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped; see the publish-macos-release skill for the one-time setup."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # macOS only: import the Developer ID certificate into a temporary keychain.
      # tauri-action itself does not import certificates, so prepare it in this step before the build.
      # The keychain password is disposable, so generate it instead of making it a Secret.
      - name: Import Apple Developer certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Add it to the search list as well. codesign looks up the identity from the search list, not the
          # default keychain. The default-keychain alone does work in practice (the same procedure in v0.1.1
          # built a notarized dmg), but be explicit so we do not depend on the runner image's defaults.
          security list-keychains -d user -s build.keychain
          # Confirm here that the Developer ID can be found via the search list, and fail immediately if not.
          # find-identity **exits 0 even with 0 identities**, so just calling it is not a check. Decide
          # with grep to avoid failing deep inside the build.
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "Error: no 'Developer ID Application' identity in the keychain search list" >&2
            exit 1
          }
          rm "$RUNNER_TEMP/certificate.p12"

      # Upload the build artifacts to the draft Release (releaseId) prepared by the draft job.
      # So that one side of the parallel matrix does not make it public by itself, publish it in the
      # publish job after all platforms succeed. When releaseId is passed, tauri-action neither looks
      # for nor creates a Release, so do not pass tagName / releaseName / releaseDraft
      # (the Release name and tag are decided by the draft job).
      # Passing macOS's APPLE_* makes tauri-action automatically do Developer ID signing +
      # notarization + staple. Since it receives Apple credentials, pin it to a commit SHA rather than
      # the mutable tag @v0 (to prevent a supply-chain attack that swaps the tag and steals secrets).
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple credentials are passed only to the macOS job (empty strings on Windows so they are not exposed).
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # Call the tauri CLI directly, bypassing the "tauri" script in package.json.
          # That one hard-codes APPLE_SIGNING_IDENTITY as an env prefix for local signing,
          # which is a syntax error in the Windows shell.
          tauriScript: pnpm exec tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

  # Publish the draft only when the build and upload of all platforms succeeded.
  # If any fails, it stays a draft (an incomplete Release is never published).
  publish:
    needs: [plan, draft, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Redo the same decision as plan right before publishing. "Re-run failed jobs" does not re-run a
      # successful plan and reuses its release=true from back then, so if a newer version was published
      # in the meantime, make_latest would roll back the latest. If stopped, the draft remains.
      #
      # Publishing is done by the id returned by the draft job, not by tag name (so it is not mixed up
      # even if there are other drafts for the same tag). target_commitish is also set again here to
      # this run's commit — the tag is created at that commit when the draft is published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release=$(VERSION="$VERSION" bash scripts/release-decide.sh)
          if [ "$release" != "true" ]; then
            echo "::error::v${VERSION} should no longer be published (see the message above); leaving the draft as it is."
            exit 1
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true \
            -f target_commitish="${GITHUB_SHA}" --silent

