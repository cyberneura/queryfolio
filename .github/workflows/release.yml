name: Release

# リリースは main の src-tauri/tauri.conf.json の version で決まる。まだリリースされて
# いない (かつ公開中の最新より新しい) version を main に載せればリリースされ、
# リリース済みの version のままなら何度 push しても何も起きない。
# ローカルからは `pnpm release [patch|minor|major]` (scripts/release.sh) で採番して
# push する。PR の中で version を上げてマージしても同じようにリリースされる。
#
# 実行可否を決めるのは diff ではなく「その version がリリース済みか」。squash / rebase /
# 直 push で diff は変わるが結果は変わらない (冪等)。path フィルターを付けないのも
# 同じ理由で、bump が想定外の形で入っても取りこぼさないため。
on:
  push:
    branches: [main]
  # PR では test ジョブだけが走る (plan 以降は if で止めてある)。門番のテストを
  # マージ前に同じ定義で回すためで、リリース経路とテストの内容がずれない。
  pull_request:
  # version は正しいのに、その時の run が (API の一時障害等で) 失敗した場合の再実行用。
  # 同じ判定を通るので、公開済みの version をもう一度出すことはできない。
  workflow_dispatch:

# 既定は権限なし。必要な job にだけ与える。特に test は PR が持ち込んだコードを
# 実行するので contents: read までしか渡さない (同一リポジトリからの PR では
# GITHUB_TOKEN が write を持ちうるため、ここを既定に任せない)。
#
# この workflow は pull_request でも起動するが、「PR で workflow 自体を書き換えれば
# contents: write のジョブを動かせる」ことにはならない。public リポジトリの fork から
# の pull_request では、permissions の記述に関わらず GITHUB_TOKEN が read-only に
# 切り下げられ secrets も渡らない (write token を渡す設定があるのは private リポジトリ
# 側の話で、ここには無い)。同一リポジトリのブランチから PR を出せるのは既に write
# 権限を持つ相手だけなので、そちらも権限の昇格にはならない。
permissions: {}

# 同時に走らないよう直列化する。1 回の dispatch が 1 つの version に対応するため、
# キャンセルされた run の version は (bump コミットは main に載ったまま) 永久に
# 公開されない状態になる。それを防ぐために 2 つとも要る:
#   cancel-in-progress: false — 走行中の run を後発でキャンセルしない。
#   queue: max — pending も最大 100 件まで積む。既定の `queue: single` は
#     「pending は 1 件だけ。新しく queue されたら既存の pending をキャンセルして
#     置き換える」なので、3 回連続で dispatch すると真ん中の version が消える。
# (queue: max と cancel-in-progress: true の併用は validation error になる)
#
# run 単位で直列なので、後続の run の plan は先行 run の publish が終わってから走り、
# 同じ version を二重にビルドしない。ただし pending の消化順は push 順とは限らない
# (GitHub は開始順を保証しない)。新しい version が先に公開された後で古い version の
# run が回ってきても、plan が「最新より古い」で止める。
#
# PR の検査 run は「1 push = 1 version」の直列化とは無関係なので、リリース用の
# グループへ入れない。同じグループにすると PR が 1 本走るだけでリリースが pending に
# 積まれる (cancel-in-progress: false なので待たされ続ける)。さらに commit ごとに
# 別グループにして、PR 側では直列化そのものを効かせない — ここで PR をまとめると
# 同じ PR へ連続 push した時に古い commit の検査が順番待ちを作り、最新 commit の
# 結果が最も遅れる (この設定では cancel-in-progress を PR だけ true にはできない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # ビルドに 30 分以上かける前に、その version がまだリリースされておらず、公開中の
  # 最新より新しいことを確かめる。ここが false を返す限り、push のたびに
  # macOS / Windows ランナーが動くことはない。
  # PR ではリリース判定そのものが無意味なので走らせない。この job が skipped に
  # なると、依存している build / publish も (always() を使っていないので) skipped に
  # なる — PR では test だけが動く。
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      # dispatch は自分の ref を指定できる。未公開 version を載せたブランチが、
      # そのブランチの内容でリリースされてしまわないようにする (push では main 以外
      # 起こり得ないが、dispatch では起こる)。
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases come from main, and this run is on ${REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version out of src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 判定の中身は scripts/release-decide.sh。publish が公開直前にも同じ判定を使う。
      # `release=$(...)` を代入で受けるのは、スクリプトの失敗 (判定不能) で step を
      # 落とすため (echo の引数の中でコマンド置換が失敗しても -e は効かない)。
      - name: Decide whether this version still needs releasing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release=$(bash scripts/release-decide.sh)
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # リリースビルドの門番。方針: cyberneura/cyberneura-github-actions の
  # docs/build-requires-tests.md
  #
  # runs-on を build と同じ macOS / Windows にしてあるのは方針のルール 4 による。
  # lib.rs の #[cfg(target_os = "macos")] や cli.rs の Windows 専用コード
  # (attach_parent_console) は、他の OS では 1 行もコンパイルされない。ubuntu で
  # cargo test を回しても、配布物に入るコードの一部を検査しないまま通してしまう。
  test:
    # push / dispatch では、実際にリリースする version の時だけ走らせる。plan を
    # 通さず無条件に走らせると、リリースを伴わない main への push のたびに
    # macOS / Windows ランナーが動く — plan を置いた目的そのものが無くなる。
    # PR では plan が skipped になり、既定ではこの job も道連れで skipped になる
    # ので、!cancelled() で自動スキップを外してからイベント名で判定する
    # (plan が失敗した時は needs.plan.result で止まる)。
    needs: plan
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'pull_request'
              || (needs.plan.result == 'success'
                  && needs.plan.outputs.release == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # ビルド用ではないので matrix.rust-targets (universal 用の 2 アーキ) は要らない。
      # ホストターゲットでテストする。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cargo test でも build.rs は走る。tauri-build は frontendDist (../build) が
      # 実在しないとアプリのコードへ到達する前に落ちるので、先にフロントを作る。
      - name: Build frontend
        run: pnpm build

      - name: Type-check frontend
        run: pnpm check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # matrix の全ジョブが成果物を上げる先の draft Release を、ビルドの前に 1 つだけ用意する。
  #
  # tauri-action に tagName だけを渡すと、各ジョブがビルド後に「その tag の Release を
  # 一覧から探し、無ければ作る」。macOS と Windows のビルドがほぼ同時に終わると (キャッシュが
  # 効いた再実行など) 両方が「無い」と判断し、同じ tag の draft が 2 つできる。publish は
  # そのうち片方しか公開できず、もう片方のプラットフォームの成果物が Release から欠ける。
  # ここで作った id を releaseId で渡せば、tauri-action は探しも作りもせずそこへ上げる。
  #
  # 失敗した run が残した draft は再利用し、target_commitish をこの run の commit に
  # 直す (draft を最初に作った run の commit のまま公開すると、tag が中身と食い違う)。
  draft:
    # test を通らないうちは draft を作らない (失敗するたびに空の draft が残るため)。
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Find or create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          # draft は tag からは引けない (releases/tags/<tag> は 404 を返す) ので一覧から探す。
          # contents: write のトークンなら一覧に draft も含まれる。
          found=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          published=$(printf '%s\n' "$found" | awk '$2 == "false" { n++ } END { print n + 0 }')
          drafts=$(printf '%s\n' "$found" | awk '$2 == "true" { print $1 }')
          draft_count=$(printf '%s\n' "$found" | awk '$2 == "true" { n++ } END { print n + 0 }')
          if [ "$published" -gt 0 ]; then
            echo "::error::${TAG} is already published, but plan decided to release it. Not touching it."
            exit 1
          fi
          # どれに上げるべきかを決められない。黙って 1 つ選ぶと、残りの draft と成果物が
          # 分かれたまま公開される。不要な draft を消してから再実行する。
          if [ "$draft_count" -gt 1 ]; then
            echo "::error::found ${draft_count} draft releases for ${TAG} (ids: $(echo $drafts)). Delete all but one, then re-run."
            exit 1
          fi
          if [ "$draft_count" -eq 1 ]; then
            id="$drafts"
            gh api -X PATCH "repos/${GH_REPO}/releases/${id}" \
              -f target_commitish="${GITHUB_SHA}" --silent
            echo "Reusing draft ${id} for ${TAG} (target set to ${GITHUB_SHA})."
          else
            id=$(gh api -X POST "repos/${GH_REPO}/releases" \
              -f tag_name="${TAG}" -f name="QueryFolio ${TAG}" \
              -F draft=true -F prerelease=false \
              -f target_commitish="${GITHUB_SHA}" --jq '.id')
            echo "Created draft ${id} for ${TAG}."
          fi
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::could not get the id of the draft release for ${TAG} (got '${id}')."
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    # test を通らずにビルドしない。needs は同じ run の job にしか効かないので、
    # テストを別 workflow に切り出さないこと。
    needs: [plan, test, draft]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel / Apple Silicon 両対応の universal バイナリを dmg で配布する。
          # 署名は下記ステップで Developer ID + 公証 (notarization)。ローカルビルドは
          # tauri.conf.json の signingIdentity "-" で ad-hoc、CI は APPLE_SIGNING_IDENTITY が
          # それを上書きする (tauri-cli の優先順位: env > config)。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          # Windows は署名なしの NSIS インストーラー (.exe) のみ。MSI は作らない。
          - platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      # persist-credentials: false — checkout が write 権限の GITHUB_TOKEN を
      # .git/config に残さないようにする。以降のステップ (pnpm install の install
      # script や third-party action) がそれを拾えないようにするため。
      # Apple の証明書を扱うジョブなので `uses:` は全て commit SHA に固定する
      # (tauri-action だけ固定しても、先行ステップの action が改変されれば同じ)。
      # 更新時は行末の `# v4` 等のコメントを頼りに新しい SHA を調べて置き換える。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # SHA は **master 履歴のコミット**を選ぶこと。`stable` / `1.89.0` などの
      # 生成ブランチの先端 SHA を pin すると、ブランチが進んだ時にその commit が
      # GC され、以降の run が Rust セットアップ前に落ちる (action の README の
      # "Choice of full-length commit SHA" 参照)。master SHA を pin する場合は
      # ref からツールチェインを推測できないので `toolchain` を明示する。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 署名・公証の Secret が 1 つでも欠けていると、tauri-action には空文字が渡るだけで
      # ビルドは通ってしまう (ad-hoc 署名や公証なしの成果物ができる)。publish ジョブは
      # 成否しか見ないため、そのまま「署名 + 公証済み」のつもりで公開される。ここで
      # 明示的に落として、配布不能な dmg が公開されるのを防ぐ。
      - name: Check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped; see the publish-macos-release skill for the one-time setup."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # macOS のみ: Developer ID 証明書を一時 keychain にインポートする。
      # tauri-action 自身は証明書をインポートしないため、ビルド前にこのステップで
      # 用意しておく。keychain のパスワードは使い捨てなので Secret にせず生成する。
      - name: Import Apple Developer certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # 検索リストにも入れる。codesign は default keychain ではなく検索リストから
          # identity を引く。default-keychain だけでも実際には通る (v0.1.1 の同一手順で
          # 公証済み dmg がビルドできている) が、runner イメージの既定に依存しないよう明示する。
          security list-keychains -d user -s build.keychain
          # 検索リスト経由で Developer ID が引けることをここで確認し、駄目なら即失敗させる。
          # find-identity は identity が **0 件でも exit 0** なので、単に呼ぶだけでは
          # チェックにならない。grep で判定してビルドの奥で落ちるのを防ぐ。
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "Error: no 'Developer ID Application' identity in the keychain search list" >&2
            exit 1
          }
          rm "$RUNNER_TEMP/certificate.p12"

      # draft ジョブが用意した draft Release (releaseId) にビルド成果物をアップロードする。
      # 並列 matrix の片方だけで公開状態にならないよう、全プラットフォーム成功後に
      # publish ジョブで公開する。releaseId を渡すと tauri-action は Release を
      # 探しも作りもしないので、tagName / releaseName / releaseDraft は渡さない
      # (Release の名前と tag は draft ジョブが決める)。
      # macOS の APPLE_* を渡すと tauri-action が Developer ID 署名 + 公証 + staple を
      # 自動で行う。Apple 認証情報を受け取るため、可変タグ @v0 ではなく commit SHA に
      # 固定する (タグが差し替えられて secrets を抜かれるサプライチェーン攻撃を防ぐ)。
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple 認証情報は macOS ジョブにのみ渡す (Windows では空文字にして露出させない)。
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # tauri CLI を直接叩き、package.json の "tauri" スクリプトを迂回する。
          # あちらはローカル署名用に APPLE_SIGNING_IDENTITY を env 前置きで
          # ハードコードしており、Windows のシェルでは構文エラーになる。
          tauriScript: pnpm exec tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

  # 全プラットフォームのビルド・アップロードが成功した時のみ draft を公開する。
  # どれかが失敗した場合は draft のまま残る (不完全な Release は公開されない)。
  publish:
    needs: [plan, draft, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 公開直前に plan と同じ判定をやり直す。「Re-run failed jobs」は成功済みの plan を
      # 再実行せず当時の release=true を使い回すので、その間に新しい version が
      # 公開されていると make_latest で最新を巻き戻してしまう。止めた場合 draft は残る。
      #
      # 公開は tag 名ではなく draft ジョブが返した id で行う (同じ tag の draft が
      # 他にあっても取り違えない)。target_commitish もここで改めてこの run の commit に
      # 合わせる — tag は draft を公開した時にその commit に作られる。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release=$(VERSION="$VERSION" bash scripts/release-decide.sh)
          if [ "$release" != "true" ]; then
            echo "::error::v${VERSION} should no longer be published (see the message above); leaving the draft as it is."
            exit 1
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true \
            -f target_commitish="${GITHUB_SHA}" --silent

