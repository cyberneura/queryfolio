[package]
name = "queryfolio"
version = "0.1.0"
description = "A SQL client desktop app"
authors = ["ytyng"]
license = "MIT"
# Not published to crates.io. Also a marker so that cargo-about does not list this crate itself (private in about.toml)
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "queryfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Because build.rs reads the version from tauri.conf.json (also a dependency of tauri-build)
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "json",
  "rust_decimal",
  "uuid",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1", features = ["serde"] }
dirs = "6"
glob = "0.3"
shlex = "1"
# For AI (OpenAI API) calls. Use rustls to avoid the openssl dependency
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
thiserror = "2"
# Client for the Redis engine (runs arbitrary commands on the tokio runtime)
# tokio-rustls-comp: required to use TcpTls for connections with tls: true
# (rustls-based; we do not add openssl). Without it, ConnectionAddr::TcpTls
# fails at runtime with "TLS feature is disabled"
redis = { version = "1.4", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
] }
# Client for the DuckDB engine (wired up by hand because sqlx has no DuckDB driver).
# bundled statically links the C++ sources (dynamically linking Homebrew's libduckdb would
# prevent a Developer ID signed app from launching due to library validation, as with ssh2).
# The API is synchronous, so execution is wrapped in spawn_blocking (engines/duckdb.rs).
# Pinned to the previous stable release per the 7-day rule (1.10505.0 was released on 2026-07-22)
duckdb = { version = "=1.10504.0", features = ["bundled"] }
# AWS SDK for the DynamoDB engine (runs PartiQL through the ExecuteStatement API).
# The AWS SDK releases almost daily, so pin with = to follow the 7-day rule
# (with a caret requirement, cargo would resolve to a release from the same day).
# default-features = false: do not use the default HTTPS client (rustls + aws-lc); build
# a ring-based client explicitly, the same as the existing dependencies (reqwest / rustls)
# (avoids adding a native build of aws-lc-sys; see engines/dynamodb.rs).
aws-config = { version = "=1.9.0", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "credentials-process",
] }
aws-sdk-dynamodb = { version = "=1.117.0", default-features = false, features = [
  "rt-tokio",
] }
aws-smithy-http-client = { version = "=1.2.0", default-features = false, features = [
  "rustls-ring",
] }
# Client for the Microsoft SQL Server engine (pure Rust implementation of the TDS protocol.
# Wired up by hand because sqlx has no MSSQL driver; engines/mssql.rs).
# default-features = false to choose the TLS backend:
# - The default native-tls cannot be used. tiberius's README states that "the macOS Security
#     Framework does not work with SQL Server's TLS configuration", and the main target of
#     the distributed builds is macOS.
# - rustls is not used: it pulls in tokio-rustls with the default feature (aws_lc_rs), which
#     would add a native build of aws-lc-sys (cmake / NASM) to CI (dynamodb avoids this by
#     explicitly choosing ring).
# - vendored-openssl (opentls): statically links OpenSSL. It is the same openssl-src as
#     ssh2's vendored-openssl, so it adds no native build.
# tds73 handles date / time / datetime2 / datetimeoffset, and chrono / rust_decimal map them
# to the same types as the existing value conversion (db.rs).
tiberius = { version = "0.13", default-features = false, features = [
  "tds73",
  "vendored-openssl",
  "chrono",
  "rust_decimal",
] }
# tiberius takes futures' AsyncRead / AsyncWrite, so wrap tokio's TcpStream with
# compat (a crate tiberius itself also pulls in as optional)
tokio-util = { version = "0.7", features = ["compat"] }
# vendored-openssl: statically links OpenSSL. Dynamically linking Homebrew's libssl would abort
# at startup in a Developer ID signed app because of library validation
# (dylibs with a different Team ID cannot be loaded). As a side effect it also works without Homebrew.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
base64 = "0.22"
# Character encoding conversion on export (CP932 / EUC-JP). For tools such as Excel
# that do not assume UTF-8
encoding_rs = "0.8"
futures = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3"

