[package]
name = "queryfolio"
version = "0.1.0"
description = "A SQL client desktop app"
authors = ["ytyng"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "queryfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "json",
  "rust_decimal",
  "uuid",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1", features = ["serde"] }
dirs = "6"
glob = "0.3"
shlex = "1"
# AI (OpenAI API) 呼び出し用。openssl 依存を避けるため rustls を使う
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
thiserror = "2"
# Redis エンジン用クライアント (tokio ランタイムで任意コマンドを実行する)
# tokio-rustls-comp: tls: true の接続で TcpTls を使うために必要
# (rustls 系。openssl は増やさない)。無いと ConnectionAddr::TcpTls が
# 実行時に「TLS feature が無効」で失敗する
redis = { version = "1.4", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
] }
# DuckDB エンジン用クライアント (sqlx に DuckDB ドライバが無いため独自結線)。
# bundled で C++ ソースを静的リンクする (Homebrew の libduckdb を動的リンクすると
# ssh2 と同じく Developer ID 署名アプリの library validation で起動できないため)。
# 同期 API のため実行は spawn_blocking で包む (engines/duckdb.rs)。
# バージョンは 7 日ルールで 1 つ前の安定版に固定 (1.10505.0 は 2026-07-22 リリース)
duckdb = { version = "=1.10504.0", features = ["bundled"] }
# DynamoDB エンジン用の AWS SDK (PartiQL を ExecuteStatement API で実行する)。
# AWS SDK はほぼ毎日リリースされるため、7 日ルールに合わせて = で固定する
# (キャレット指定だと cargo が当日リリースへ解決してしまう)。
# default-features = false: 既定の HTTPS クライアント (rustls + aws-lc) を使わず、
# 既存依存 (reqwest / rustls) と同じ ring ベースのクライアントを明示的に組む
# (aws-lc-sys のネイティブビルドを増やさない。engines/dynamodb.rs 参照)。
aws-config = { version = "=1.9.0", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "credentials-process",
] }
aws-sdk-dynamodb = { version = "=1.117.0", default-features = false, features = [
  "rt-tokio",
] }
aws-smithy-http-client = { version = "=1.2.0", default-features = false, features = [
  "rustls-ring",
] }
# vendored-openssl: OpenSSL を静的リンクする。Homebrew の libssl を動的リンクすると
# Developer ID 署名アプリで library validation により起動時 abort するため
# (異なる Team ID の dylib はロード不可)。副次的に Homebrew 未導入環境でも動く。
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
base64 = "0.22"
# エクスポート時の文字コード変換 (CP932 / EUC-JP)。Excel 等の
# UTF-8 を前提としないツール向け
encoding_rs = "0.8"
futures = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3"

