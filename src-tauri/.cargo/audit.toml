# cargo audit configuration (CYBERNEURA-DEV-577)
#
# The IDs listed here are ones we investigated and judged "cannot be upgraded right now / do not
# affect us". **This is not a place to pretend we did not see them.** The goal is to leave only
# genuinely new items in the audit output, so we do not get into the habit of skipping the same lines every time.
#
# When adding one, always write the reason and when it can be removed. Delete it once upstream fixes it.

[advisories]
ignore = [
  # rsa 0.9.10 — Marvin Attack (possible key recovery via a timing side channel)
  #
  # Path: sqlx > sqlx-mysql > rsa. **No fixed version exists** (RustSec's Solution is also
  # "No fixed upgrade is available!"). It will not go away as long as sqlx is used for MySQL.
  #
  # **It does not reach the vulnerable operation in the first place.** What Marvin leaks is the
  # **timing of decryption (and signing) that uses the private key**, not encryption.
  # sqlx-mysql uses rsa in the caching_sha2_password / sha256_password handshake, and only for
  # **one direction: encrypting the password with the server's public key**.
  # The client has no RSA private key and does neither decryption nor signing.
  #
  # Condition for removal: when sqlx stops using rsa, or rsa gets a constant-time implementation.
  # **If sqlx-mysql starts doing RSA decryption or signing, this judgment becomes invalid.**
  "RUSTSEC-2023-0071",

  # rkyv 0.7.46 — out-of-bounds read due to insufficient validation of archives containing Rc/Arc
  #
  # Path: an **optional feature** of rust_decimal (`rkyv = ["dep:rkyv"]`).
  # This app does not enable that feature, so **rkyv is not compiled**.
  # It appears in Cargo.lock (the lockfile records resolution including optional dependencies), so
  # cargo audit picks it up, but it does not go into the binary.
  #
  # How to verify (both come back empty):
  #   cargo tree -e normal -i rkyv --target all
  #   cargo tree -e features -i rust_decimal --target all | grep rkyv
  #
  # There is also no place in the app that deserializes untrusted rkyv archives.
  #
  # Condition for removal: when rust_decimal moves to rkyv 0.8 (the latest at present, 1.42.1, is still 0.7).
  # Or, as soon as there is a reason to enable this feature, **delete this ignore** and
  # verify that rkyv has actually been upgraded.
  "RUSTSEC-2026-0235",

  # zip 6.0.0 — symlink / permission handling in `ZipArchive::extract` (RUSTSEC-2026-0367 / 0368 / 0369)
  #
  # Path: libduckdb-sys 1.10504.0 **build-dependency** only (`cargo tree -i zip@6.0.0 --target all -e all`
  # shows `[build-dependencies] libduckdb-sys`). It is used at build time to unpack the DuckDB
  # source archive that ships inside the libduckdb-sys crate from crates.io, and nothing from it
  # goes into the application binary. The archive it extracts is bundled with the pinned
  # libduckdb-sys crate (checksum in Cargo.lock); it is not supplied by application users, so
  # the symlink / permission issues these advisories describe have no untrusted input to act on.
  #
  # The fixed version (zip >= 9) cannot be selected by `cargo update -p zip` because libduckdb-sys
  # pins the 6.x range.
  #
  # Condition for removal: when libduckdb-sys requires zip >= 9. Delete these three lines then and
  # verify the upgrade actually happened.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",

  # webpki-roots 0.26.11 — bundled root certificates trust distrusted emSign intermediates (RUSTSEC-2026-0381)
  #
  # Path: sqlx-core 0.8.6 > webpki-roots 0.26.11. The advisory's fixed range is >= 1.0.10 only, so
  # cargo audit keeps flagging the 0.26 line. But 0.26.11 (the last 0.26 release) is a semver trick:
  # its only dependency is `webpki-roots = "1"` and it re-exports that crate's root store
  # (see its lib.rs: "This crate version is a semver trick to webpki-roots v1"). The roots actually
  # compiled in come from webpki-roots 1.0.10, which has the fix, so the app is not affected.
  #
  # How to verify:
  #   cargo tree -i webpki-roots@0.26.11 --target all   (reached from sqlx-core only)
  #   grep -A3 'name = "webpki-roots"' Cargo.lock       (the 1.x entry must be >= 1.0.10)
  #
  # Condition for removal: when sqlx-core depends on webpki-roots 1.x directly and 0.26.11
  # disappears from Cargo.lock. **If webpki-roots 1.x in Cargo.lock drops below 1.0.10, this
  # judgment becomes invalid.**
  "RUSTSEC-2026-0381",
]
