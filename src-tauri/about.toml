# cargo-about configuration, read by scripts/generate-third-party-notices.sh.
# Only crates that ship in the distributed build are covered: dependencies used only at build
# or test time, and crates that only land in targets we do not distribute (Linux), are excluded.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    # webpki-roots (Mozilla CA certificate data). A permissive data license with attribution only
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
workarounds = ["rustls"]

# Do not list queryfolio itself (publish = false)
[private]
ignore = true

# For the crates below, cargo-about treats a source file that starts with a license notice as
# the license text and ends up embedding the whole source file. Name the files to use as the
# license text explicitly.
# Each checksum is the sha256 of the file; if a crate upgrade changes the file, cargo-about
# warns and stops using this entry (then re-take it from the file in the new version).
# ring does not use cargo-about's built-in "ring" workaround because it does not match the
# 0.17 layout.
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[encoding_rs.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[encoding_rs.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "3fa4ca83dcc9237839b1bdeb2e6d16bdfb5ec0c5ce42b24694d8bbf0dcbef72c"

[[encoding_rs.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

[[encoding_rs.clarify.files]]
path = "LICENSE-WHATWG"
license = "BSD-3-Clause"
checksum = "838118388fe5c2e7f1dbbaeed13e1c7f3ebf88be91319c7c1d77c18e987d1a50"

[schemars_derive.clarify]
