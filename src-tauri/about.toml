# cargo-about の設定。scripts/generate-third-party-notices.sh が読む。
# 配布物に入る crate だけを対象にする: ビルド時・テスト時だけの依存と、配布しない
# ターゲット (Linux) にしか入らない crate は除く。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    # webpki-roots (Mozilla の CA 証明書データ)。表示義務のみの許容的なデータライセンス
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
workarounds = ["rustls"]

# queryfolio 自身 (publish = false) を一覧に載せない
[private]
ignore = true

# 以下の crate は、ライセンスの注記が先頭にあるソースファイルを cargo-about がライセンス本文と
# 判定し、ソースファイルを丸ごと載せてしまう。本文にするファイルを明示する。
# checksum は各ファイルの sha256 で、crate を上げてファイルが変わると cargo-about が
# 警告してこの指定を使わなくなる (その時は新しい version のファイルで取り直す)。
# ring は cargo-about 組み込みの "ring" workaround が 0.17 の構成に合わないので使わない。
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[encoding_rs.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[encoding_rs.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "3fa4ca83dcc9237839b1bdeb2e6d16bdfb5ec0c5ce42b24694d8bbf0dcbef72c"

